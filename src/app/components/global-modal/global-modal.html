@if (modalService.isOpen()) {
  <div class="modal-backdrop fade show"></div>
  <div class="modal fade show d-block" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content shadow-lg border-0">
        <div class="modal-header">
          <h5 class="modal-title font-serif fw-bold">{{ modalService.title() }}</h5>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="modalService.closeModal()"
          ></button>
        </div>
        <div class="modal-body">
          @switch (modalService.modalType()) {
            @case ('confirmation') {
              <p class="text-muted mb-0">{{ modalService.message() }}</p>
            }
            <!-- Future modal types can be added here -->
          }
        </div>
        <div class="modal-footer border-0">
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            (click)="modalService.closeModal()"
          >
            Cancel
          </button>
          <button type="button" class="btn btn-danger btn-sm" (click)="modalService.confirm()">
            Confirm Delete
          </button>
        </div>
      </div>
    </div>
  </div>
}
