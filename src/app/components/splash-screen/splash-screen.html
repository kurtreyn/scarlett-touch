<div class="splash-screen">
  <div class="title-container">
    <h1>The Scarlett Touch</h1>
  </div>

  <div class="announcements-area">
    @let latestAnnouncements = homePageAnnouncements$ | async;
    @if (latestAnnouncements && latestAnnouncements.length > 0) {
      <ul>
        <li>{{ latestAnnouncements[0].content }}</li>
      </ul>
    }
  </div>

  <div class="social-links-area">
    @for (icon of socialIcons; track icon) {
      <a [href]="icon.link" target="_blank">
        <img [src]="icon.icon" [alt]="icon.name" />
      </a>
    }
  </div>

  <img [src]="splashScreenImage()" alt="Splash Screen" />
</div>
