<div class="page-container">
  <!-- Loading Spinner Overlay -->
  @if (isLoading()) {
    <div
      class="spinner-overlay d-flex justify-content-center align-items-center position-absolute w-100 h-100 bg-white bg-opacity-75"
      style="z-index: 10"
    >
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }

  <div class="admin flex-col">
    <div class="flex-row">
      <div class="form-area flex-col w-50 mb-2">
        <app-global-form formType="post"></app-global-form>
      </div>
      <div class="form-area flex-col w-50">
        <app-post-editor [posts]="posts$ | async"></app-post-editor>
      </div>
    </div>

    <button (click)="logout()" class="btn btn-warning">Sign Out</button>
  </div>
</div>
