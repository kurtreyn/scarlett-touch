<div class="page-container">
  <app-nav [useDarkLines]="true"></app-nav>
  <!-- Loading Spinner Overlay -->
  @if (isLoading()) {
    <app-loading-screen></app-loading-screen>
  }

  <div class="admin flex-col">
    <div class="flex-row">
      <div class="form-area flex-col w-50 mb-2">
        <app-global-form formType="post"></app-global-form>
        <button (click)="logout()" class="btn btn-warning max-btn-width mt-5">Sign Out</button>
      </div>
      <div class="form-area flex-col w-50">
        <app-post-editor [posts]="posts$ | async"></app-post-editor>
      </div>
    </div>
  </div>
</div>
